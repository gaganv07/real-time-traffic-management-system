apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-platform
  namespace: traffic-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: traffic-platform
  template:
    metadata:
      labels:
        app: traffic-platform
    spec:
      containers:
        - name: platform
          image: ghcr.io/example/traffic-platform:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
