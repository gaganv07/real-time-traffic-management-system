apiVersion: v1
kind: Service
metadata:
  name: traffic-api
  namespace: traffic-system
spec:
  selector:
    app: traffic-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-web
  namespace: traffic-system
spec:
  selector:
    app: traffic-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-ai
  namespace: traffic-system
spec:
  selector:
    app: traffic-ai
  ports:
    - name: http
      port: 8001
      targetPort: 8001

