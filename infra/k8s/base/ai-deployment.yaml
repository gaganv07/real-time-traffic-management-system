apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-ai
  namespace: traffic-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-ai
  template:
    metadata:
      labels:
        app: traffic-ai
    spec:
      containers:
        - name: ai
          image: ghcr.io/example/traffic-ai:latest
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001

