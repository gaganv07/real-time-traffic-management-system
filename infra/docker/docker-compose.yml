version: "3.9"

services:
  platform:
    build:
      context: ../../
      dockerfile: infra/docker/platform.Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: super-secret
      ENVIRONMENT: development
    depends_on:
      - redis
      - postgres
      - mongo

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

volumes:
  pgdata:
