name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/platform/requirements.txt pytest
      - name: Compile platform
        run: python -m compileall services/platform/app
      - name: Run platform tests
        working-directory: services/platform
        run: pytest -q
